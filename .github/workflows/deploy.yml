# Builds the app and publishes it to GitHub Pages on every run — main to the
# site root, and every pull request to a preview path of its own.
#
#   main          https://majakulpa.github.io/italian-app/
#   pull request  https://majakulpa.github.io/italian-app/pr-42/
#
# Why a gh-pages branch rather than actions/deploy-pages. That action publishes
# one artifact as the whole site, so there is exactly one version of the app
# live at a time: deploying a pull request with it would replace the real app
# with unreviewed code until the next merge put it back. A branch holds many
# directories at once, so a preview can sit beside the app instead of on top
# of it.
#
# The build gets --base pointed at wherever it will be served from, because
# Vite writes that prefix into every asset URL. It is passed here rather than
# set in vite.config.js so `npm run dev` and the test suite keep serving from /.
#
# No SPA fallback (404.html) is needed: the app has no URL router — screens are
# React state inside one page — so there is only ever one URL to load.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    # `closed` is here for the cleanup job below, which deletes a merged or
    # abandoned pull request's preview. Without it previews accumulate forever.
    types: [opened, synchronize, reopened, closed]
  # A deploy that never happened leaves no red tick to notice — the site just
  # quietly stays on an older commit. Four merges went missing that way before
  # the concurrency rule below was fixed. Once a day main is rebuilt and
  # republished whether or not anything was pushed, so the longest the site can
  # be out of date is a day rather than forever.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# contents: write, because publishing is a commit to gh-pages. The old
# pages/id-token permissions belonged to actions/deploy-pages and are gone with
# it.
permissions:
  contents: write

# One group per ref, so a pull request can never cancel a deploy of main, and
# no cancellation on main: a cancelled deploy is a merge that silently never
# reaches the site, which is how #35, #36, #40 and #45 went missing. A pull
# request still cancels its own superseded runs, where the only thing lost is
# CI minutes.
concurrency:
  # Every run of main gets a group to itself, so no main deploy can ever be
  # cancelled by another. `cancel-in-progress: false` was not enough: it only
  # protects a run that has already started. Merging #50 and #51 ten seconds
  # apart left #51's run *queued*, and GitHub cancelled it there — two seconds,
  # no jobs, and main never published. That is the same silent failure the
  # per-ref group was added to stop, one step earlier in the lifecycle.
  #
  # Two main deploys may now overlap. That is safe here because publishing is a
  # push to gh-pages and scripts/publish-pages.sh retries from a fresh clone
  # when it loses the race, so the loser republishes rather than disappearing.
  group: pages-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Nothing to build when a pull request is merely closing; the cleanup job
    # handles that event.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Not 20: jsdom (via undici) needs Node >= 22.22 or >= 24.15, and on
          # Node 20 every test file fails to start with
          # "webidl.util.markAsUncloneable is not a function" — no test runs,
          # the step fails, and nothing deploys. That was the first run.
          node-version: 24
          cache: npm
      - run: npm ci

      # CLAUDE.md: nothing ships on a red suite — and the suite is the one with
      # the coverage gate on it, not the bare one.
      #
      # This used to be `npm test`, which is `vitest run` with no coverage. The
      # 100% thresholds in vite.config.js therefore only ever fired on a
      # machine where somebody remembered to type `npm run test:coverage`, and
      # CI would go green on a pull request that dropped them. A gate nothing
      # enforces is a comment.
      #
      # One command rather than two: `test:coverage` runs every test `npm test`
      # runs — src/ and the scripts/ suites alike — so running both would just
      # pay for the slower pass twice.
      - run: npm run test:coverage

      # Where this build will be served from. A pull request goes to its own
      # directory; everything else is the site root.
      - id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "base=/italian-app/pr-${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "base=/italian-app/" >> "$GITHUB_OUTPUT"
          fi

      - run: npx vite build --base=${{ steps.target.outputs.base }}

      # ── The browser suite, on pull requests ONLY ───────────────────────
      #
      # `if: github.event_name == 'pull_request'` on EVERY step below, and
      # that is the load-bearing part. main's publish path stays byte-for-byte
      # what it was: this repo lost four deploys to silent cancellation
      # (#35/#36/#40/#45), the concurrency rules above are the scar tissue,
      # and a browser suite is not worth risking a fifth. main never runs E2E
      # at all. The PR is the review gate; gating it there is enough.
      #
      # Placed after the build and BEFORE the secrets check, which is a
      # correction rather than a preference. The report is written into dist/,
      # and scripts/check-no-secrets.mjs walks EVERY file in dist/ (not just
      # the service worker's globPatterns — see decision 2 in its header). Run
      # the scan first and the report it has never seen is published anyway:
      # 8MB of generated HTML, JSON attachments and videos, on a public repo,
      # straight past the one guard that exists to stop that. So the order is
      # build -> e2e -> scan -> publish, and main's path is unchanged because
      # the e2e step is a no-op there.
      #
      # CI downloads its own browsers. The exact pins in package.json are a
      # local concern — this container ships chromium-1194 and ffmpeg-1011
      # preinstalled, which 1.56.x is the release that pins, so a developer
      # runs `npm run e2e` with no download at all.
      - name: Install Chromium for Playwright
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      # ORDER MATTERS HERE, and it is deliberate: `continue-on-error` plus the
      # trailing gate at the bottom of this job means a RED SUITE STILL
      # PUBLISHES ITS OWN REPORT. A failure you can open, watch the video of
      # and read the measured contrast ratio out of is worth more than a red
      # tick with nothing behind it — and the PR check still goes red, because
      # the last step re-raises the failure after the publish has happened.
      - name: Browser E2E + WCAG 2.1 AA suite
        id: e2e
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # list AND html: `--reporter=html` alone replaces the config's reporter
        # list, which left the CI job log with no per-test output at all — a
        # failure showed up only inside the published report.
        run: npx playwright test --reporter=list,html
        env:
          # scripts/publish-pages.sh copies dist/ wholesale, so writing the
          # report here puts it at /italian-app/pr-N/e2e-report/ with NO
          # change to that script.
          PLAYWRIGHT_HTML_OUTPUT_DIR: dist/e2e-report
          # `--reporter=html` on the command line replaces the config's
          # reporter list and its options, so "don't try to open a browser"
          # has to come from the environment rather than from
          # playwright.config.js.
          PLAYWRIGHT_HTML_OPEN: never

      # Nothing shaped like an Anthropic API key may reach the published site
      # or the repository — the scene partner is called with the learner's own
      # key (see src/shared/sceneKey.js), and this is a public repo publishing
      # to GitHub Pages.
      #
      # Its own step, and not a `postbuild` hook in package.json: CI runs
      # `npx vite build`, so `npm run build` never runs here and a hook on it
      # would never fire on the build that actually deploys.
      #
      # It sits immediately before the publish, after everything that writes
      # into dist/ — the build AND the E2E report — so that a hit stops
      # anything from being published at all. It runs unconditionally, on main
      # as on a pull request.
      - run: node scripts/check-no-secrets.mjs

      # A pull request raised from a fork cannot push, and its token is
      # read-only by design. Build and test it — that is the part that protects
      # main — and skip publishing rather than failing the run.
      - name: Publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET: ${{ steps.target.outputs.dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-pages.sh "$TARGET"

      # The gate, after the publish. See the comment on the e2e step: the
      # report is already up by the time this runs, so a red suite leaves
      # both a red check AND something to look at.
      - name: Fail the run if the browser suite failed
        if: github.event_name == 'pull_request' && steps.e2e.outcome == 'failure'
        run: |
          echo "The browser E2E / WCAG AA suite failed."
          echo "Report: https://majakulpa.github.io/italian-app/pr-${{ github.event.number }}/e2e-report/"
          exit 1

  # Delete a preview when its pull request closes, merged or not. Previews are
  # free to make and would otherwise be kept forever by nobody in particular.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          TARGET: pr-${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-pages.sh --remove "$TARGET"
