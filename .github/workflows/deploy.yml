# Builds the app and publishes it to GitHub Pages on every merge to main, and
# once a day regardless, so a deploy that silently never ran cannot leave the
# site behind main indefinitely.
#
# The site is served from https://majakulpa.github.io/italian-app/, so the
# build gets `--base=/italian-app/`. It is passed here rather than set in
# vite.config.js so `npm run dev` and the test suite keep serving from `/`.
#
# No SPA fallback (404.html) is needed: the app has no URL router — screens
# are React state inside one page — so there is only ever one URL to load.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A deploy that never happened leaves no red tick to notice — the site just
  # quietly stays on an older commit. Four merges went missing that way before
  # the concurrency rule below was fixed. This is the belt to that braces: once
  # a day, main is rebuilt and republished whether or not anything was pushed,
  # so the longest the site can be out of date is a day rather than forever.
  #
  # It costs one build a day and it is the only thing here that can notice a
  # deploy nobody watched. 04:17 rather than on the hour: scheduled jobs queue
  # behind everyone else's cron, and the hour is the worst time to ask.
  schedule:
    - cron: "17 4 * * *"
  # The build job (suite + build) also runs on pull requests, so a broken
  # pipeline shows up on the PR instead of as a 404 after merging. Only the
  # deploy job is restricted to main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Why this is not the usual `group: pages` + `cancel-in-progress: true`.
#
# That is one group for every run in the repository, pull requests included,
# with cancellation on — so the newest run kills whatever is in flight. Merge
# two pull requests a minute apart and the first merge's deploy is cancelled
# by the second, and because nothing re-runs it, that commit never reaches the
# site. It had happened four times by October: #35, #36, #40 and #45 all show
# as `cancelled` on main, each killed by the merge that followed it.
#
# Worse, a push to any pull request could cancel a main deploy, and the pull
# request's own run skips the deploy job — so the site would just stop at
# whatever shipped last, with a green tick on every check.
#
# So: one group per ref, which keeps pull requests out of main's way, and no
# cancellation on main. Deploys of main queue and each one publishes. Builds of
# a pull request still cancel their own superseded runs, because there the only
# thing lost is CI minutes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Not 20: jsdom (via undici) needs Node >= 22.22 or >= 24.15, and on
          # Node 20 every test file fails to start with
          # "webidl.util.markAsUncloneable is not a function" — no test runs,
          # the step fails, and nothing deploys. That was the first run.
          node-version: 24
          cache: npm
      - run: npm ci
      # CLAUDE.md: nothing ships on a red suite — and the suite is the one with
      # the coverage gate on it, not the bare one.
      #
      # This used to be `npm test`, which is `vitest run` with no coverage. The
      # 100% thresholds in vite.config.js therefore only ever fired on a
      # machine where somebody remembered to type `npm run test:coverage`, and
      # CI would go green on a pull request that dropped them. A gate nothing
      # enforces is a comment.
      #
      # One command rather than two: `test:coverage` runs every test `npm test`
      # runs — src/ and the scripts/ suites alike — so running both would just
      # pay for the slower pass twice.
      - run: npm run test:coverage
      - run: npx vite build --base=/italian-app/
      # Nothing shaped like an Anthropic API key may reach the published site
      # or the repository — the scene partner is called with the learner's own
      # key (see src/shared/sceneKey.js), and this is a public repo publishing
      # to GitHub Pages.
      #
      # Its own step, here, and not a `postbuild` hook in package.json: the
      # line above is `npx vite build`, so `npm run build` never runs in CI and
      # a hook on it would never fire on the build that actually deploys. It
      # goes between the build and the upload so that a hit stops the artifact
      # from being created at all.
      - run: node scripts/check-no-secrets.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
